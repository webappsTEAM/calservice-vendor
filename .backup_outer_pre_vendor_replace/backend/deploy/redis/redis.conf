# ==============================================================================
# CalTrack Workforce — Production Redis Configuration
# Path: /etc/redis/redis.conf or mounted into Docker container
# ==============================================================================

# 1. NETWORK SECURITY — BIND STRICTLY TO LOCALHOST / PRIVATE INTERFACE
# Never bind to 0.0.0.0 or expose to public WAN!
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# 2. GENERAL SETTINGS
daemonize no
supervised no
loglevel notice
logfile ""

# 3. MEMORY MANAGEMENT
# Keep bounded memory for VPS safety.
# No random eviction: transient keys (job_location:<id>) have explicit TTL (300s).
# Streams and GEO sets are durable operational structures.
maxmemory 256mb
maxmemory-policy volatile-lru

# 4. PERSISTENCE (AOF FOR DURABLE STREAM QUEUE)
# Ensures Redis Stream dispatch messages survive process restarts.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 5. CLIENT & BUFFER LIMITS
# Prevent slow Pub/Sub clients from accumulating unbounded memory
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
