org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental Build Tools API cache cannot compute a relative path
# between plugin sources on one drive letter (pub cache, e.g. C:) and the
# project build directory on another (e.g. F:), which crashes
# compileDebugKotlin for any plugin with native Android Kotlin sources
# (observed with share_plus). Disabling incremental compilation avoids the
# crash; only trade-off is a slightly slower Kotlin compile step.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.enableGlobalSynthetics=false
