name: Vendor Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - gokul
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    name: Workforce Django System & Migration Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: workforce_core.settings
          SECRET_KEY: ci-temporary-validation-secret-key-32-chars-minimum
          DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      - name: Validate Migration Schema Consistency
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: workforce_core.settings
          SECRET_KEY: ci-temporary-validation-secret-key-32-chars-minimum
          DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
