name: Deploy Vendor Production

on:
  push:
    branches:
      - gokul
  workflow_dispatch:

concurrency:
  group: production-deploy-vendor
  cancel-in-progress: false

jobs:
  deploy:
    name: Release Deployment to Hostinger VPS
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://vendor.caldimservices.online

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Production Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
        env:
          VITE_WORKFORCE_API_URL: https://api.caldimservices.online

      - name: Package Release Tarball
        run: |
          mkdir -p /tmp/pkg
          cp -r backend /tmp/pkg/
          mkdir -p /tmp/pkg/frontend
          cp -r frontend/dist /tmp/pkg/frontend/
          cd /tmp/pkg
          tar -czf /tmp/vendor_release_${{ github.sha }}.tar.gz *

      - name: Setup Deployer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOYER_SSH_KEY }}

      - name: Upload Release to VPS
        run: |
          scp -o StrictHostKeyChecking=no /tmp/vendor_release_${{ github.sha }}.tar.gz deployer@${{ secrets.DEPLOY_HOST }}:/tmp/

      - name: Execute Atomic Deployment on VPS
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.DEPLOY_HOST }} "/var/www/calservices/shared/scripts/deploy_vendor.sh ${{ github.sha }}"
